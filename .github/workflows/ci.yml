name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux test, race, and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  windows:
    name: Windows 2025 cgo test, vet, and unsigned build
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
      GOOS: windows
      GOARCH: amd64
      CC: C:\mingw64\bin\gcc.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache: true
          cache-dependency-path: go.sum

      - name: Verify MinGW compiler
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:CC -PathType Leaf)) {
            throw "MinGW compiler not found at $env:CC"
          }
          & $env:CC --version

      - name: Test with Windows cgo
        run: go test ./...

      - name: Vet with Windows cgo
        run: go vet ./...

      - name: Build unsigned Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -o dist/voxink-windows-amd64.exe ./cmd/voxink

      - name: Upload unsigned Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voxink-windows-amd64
          path: |
            dist/voxink-windows-amd64.exe
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
